[project]
name = "lapcoach"
version = "0.1.0"
description = "LapCoach：赛车遥测复盘助手，把每场比赛的结论记进 PowerContext，下次自动带出来"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["powercontext[cli,server]==1.2.0"]

[project.scripts]
lapcoach = "lapcoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lapcoach"]

[tool.uv]
package = true
